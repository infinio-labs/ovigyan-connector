name: Connector release artifacts

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: connector-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Never package a tag that did not pass the same tests and installer smoke test as a pull request.
  ci:
    name: Verify tagged commit
    uses: ./.github/workflows/ci.yml
    with:
      package: 'false' # release packages (and signs) the artifacts itself

  package:
    name: Package (${{ matrix.artifact }})
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux
          - os: windows-latest
            artifact: windows
    env:
      SIGN_CERT: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}
      WINDOWS_SIGN_CERT_BASE64: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}
      WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Build executable
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller==6.16.0
          extra=""
          if [ "${{ matrix.artifact }}" != "linux" ]; then
            python -m pip install ".[tray]"
            extra="--collect-submodules pystray"
          fi
          pyinstaller --clean --noconfirm --onefile \
            --collect-submodules zk $extra \
            --name ovigyan-connector launcher.py

      - name: Linux install kit
        if: matrix.artifact == 'linux'
        run: |
          cp packaging/linux/install.sh dist/ovigyan-connector-install.sh
          cp packaging/linux/uninstall.sh dist/ovigyan-connector-uninstall.sh
          cp packaging/systemd/ovigyan-connector.service dist/ovigyan-connector.service

      - name: Install Inno Setup
        if: matrix.artifact == 'windows'
        run: choco install innosetup -y --no-progress

      - name: Sign connector executable
        if: matrix.artifact == 'windows' && env.SIGN_CERT != ''
        shell: pwsh
        run: ./packaging/windows/sign.ps1 -Path dist\ovigyan-connector.exe

      - name: Build Windows installer
        if: matrix.artifact == 'windows'
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC failed' }

      - name: Sign installer
        if: matrix.artifact == 'windows' && env.SIGN_CERT != ''
        shell: pwsh
        run: |
          Get-ChildItem dist\ovigyan-connector-setup-*.exe | ForEach-Object { ./packaging/windows/sign.ps1 -Path $_.FullName }

      - name: Warn when unsigned
        if: matrix.artifact == 'windows' && env.SIGN_CERT == ''
        run: echo '::warning::WINDOWS_SIGN_CERT_BASE64 is not set; the installer and executable are UNSIGNED and must not be deployed.'

      - name: Create integrity manifest
        shell: bash
        env:
          ARTIFACT_OS: ${{ matrix.artifact }}
        run: |
          python - <<'PY'
          from hashlib import sha256
          import os
          from pathlib import Path

          files = sorted(Path('dist').glob('ovigyan-connector*'))
          if not files:
              raise SystemExit('no connector artifact was produced')
          manifest = []
          for path in files:
              if path.is_file():
                  manifest.append(f'{sha256(path.read_bytes()).hexdigest()}  {path.name}')
          name = f"SHA256SUMS-{os.environ['ARTIFACT_OS']}"
          Path('dist', name).write_text('\n'.join(manifest) + '\n', encoding='utf-8')
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: ovigyan-connector-${{ matrix.artifact }}-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30


  publish:
    name: Publish release assets
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # The installed connectors update themselves from this file: they trust a release only when its manifest is
      # signed with the key whose public half is built into them (scripts/make-update-key.py sets that up).
      - name: Sign the update manifest
        env:
          SIGNING_KEY: ${{ secrets.CONNECTOR_UPDATE_SIGNING_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo '::warning::CONNECTOR_UPDATE_SIGNING_KEY is not set; this release will NOT be offered to installed connectors.'
            exit 0
          fi
          python -m pip install -q cryptography
          python - <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey

          files = {}
          for path in sorted(Path('artifacts').rglob('*')):
              if path.is_file() and not path.name.startswith('SHA256SUMS'):
                  if path.name in files:
                      raise SystemExit(f'duplicate artifact name: {path.name}')
                  files[path.name] = hashlib.sha256(path.read_bytes()).hexdigest()
          manifest = json.dumps({'version': os.environ['RELEASE_TAG'].lstrip('v'), 'files': files}, sort_keys=True).encode()
          key = Ed25519PrivateKey.from_private_bytes(base64.b64decode(os.environ['SIGNING_KEY'].strip()))
          Path('artifacts/manifest.json').write_bytes(manifest)
          Path('artifacts/manifest.json.sig').write_bytes(base64.b64encode(key.sign(manifest)))
          PY

      - name: Publish executables and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [ "$is_draft" != true ]; then
              echo 'Refusing to upload unsigned connector binaries to a published release.' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --draft --prerelease
          fi
          mapfile -d '' files < <(find artifacts -type f -print0)
          test "${#files[@]}" -gt 0
          gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
