name: Connector release artifacts

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: connector-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
          - os: windows-latest
            artifact: windows
    env:
      SIGN_CERT: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}
      WINDOWS_SIGN_CERT_BASE64: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}
      WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build executable
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller==6.16.0
          pyinstaller --clean --noconfirm --onefile \
            --collect-submodules zk \
            --name ides-device-connector launcher.py

      - name: Install Inno Setup
        if: matrix.artifact == 'windows'
        run: choco install innosetup -y --no-progress

      - name: Sign connector executable
        if: matrix.artifact == 'windows' && env.SIGN_CERT != ''
        shell: pwsh
        run: ./packaging/windows/sign.ps1 -Path dist\ides-device-connector.exe

      - name: Build Windows installer
        if: matrix.artifact == 'windows'
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC failed' }

      - name: Sign installer
        if: matrix.artifact == 'windows' && env.SIGN_CERT != ''
        shell: pwsh
        run: |
          Get-ChildItem dist\ides-device-connector-setup-*.exe | ForEach-Object { ./packaging/windows/sign.ps1 -Path $_.FullName }

      - name: Warn when unsigned
        if: matrix.artifact == 'windows' && env.SIGN_CERT == ''
        run: echo '::warning::WINDOWS_SIGN_CERT_BASE64 is not set; the installer and executable are UNSIGNED and must not be deployed.'

      - name: Create integrity manifest
        shell: bash
        env:
          ARTIFACT_OS: ${{ matrix.artifact }}
        run: |
          python - <<'PY'
          from hashlib import sha256
          import os
          from pathlib import Path

          files = sorted(Path('dist').glob('ides-device-connector*'))
          if not files:
              raise SystemExit('no connector artifact was produced')
          manifest = []
          for path in files:
              if path.is_file():
                  manifest.append(f'{sha256(path.read_bytes()).hexdigest()}  {path.name}')
          name = f"SHA256SUMS-{os.environ['ARTIFACT_OS']}"
          Path('dist', name).write_text('\n'.join(manifest) + '\n', encoding='utf-8')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ides-device-connector-${{ matrix.artifact }}-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30


  publish:
    name: Publish release assets
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish executables and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [ "$is_draft" != true ]; then
              echo 'Refusing to upload unsigned connector binaries to a published release.' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --draft --prerelease
          fi
          mapfile -d '' files < <(find artifacts -type f -print0)
          test "${#files[@]}" -gt 0
          gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
