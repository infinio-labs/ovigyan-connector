name: connector-ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall -q src
      - name: Validate Windows service scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem packaging/windows/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors
            ) > $null
            if ($errors.Count -gt 0) { throw $errors }
          }

  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macOS remains test-only until Apple signing/notarization is enabled.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pyinstaller==6.16.0
      - name: Build executable
        run: >-
          pyinstaller --clean --noconfirm --onefile
          --collect-submodules zk
          --name ides-device-connector launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: ides-device-connector-${{ matrix.os }}
          path: dist/ides-device-connector*
