name: connector-ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall -q src

  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pyinstaller==6.16.0
      - name: Build executable
        run: >-
          pyinstaller --clean --noconfirm --onefile
          --collect-submodules zk
          --name ides-device-connector launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: ides-device-connector-${{ matrix.os }}
          path: dist/ides-device-connector*
