name: connector-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      package:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: connector-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.name }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        # Linux runs on the self-hosted runner. Windows stays on a GitHub-hosted runner: the connector ships
        # as a Windows service and the installer scripts can only be checked there. macOS is not shipped.
        include:
          - { name: linux, os: self-hosted, python: '3.10' }
          - { name: linux, os: self-hosted, python: '3.13' }
          - { name: windows, os: windows-latest, python: '3.13' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall -q src
      - name: Validate Windows service scripts
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem packaging/windows/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors
            ) > $null
            if ($errors.Count -gt 0) { throw $errors }
          }

  package:
    name: Package (${{ matrix.name }})
    if: inputs.package != false
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: self-hosted }
          - { name: windows, os: windows-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pyinstaller==6.16.0
      - name: Build executable
        run: >-
          pyinstaller --clean --noconfirm --onefile
          --collect-submodules zk
          --name ides-device-connector launcher.py
      - name: Install Inno Setup
        if: matrix.name == 'windows'
        run: choco install innosetup -y --no-progress
      - name: Build Windows installer
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=0.0.0-ci packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC failed' }
      - name: Smoke-test installer (silent install, task, config ACL, uninstall)
        if: matrix.name == 'windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem dist\ides-device-connector-setup-*.exe).FullName
          $cfg = "$env:ProgramData\IDeS Device Connector\connector.env"
          $task = 'IDeS Attendance Device Connector'
          function Run-Exe($file, $arguments, $label) {
            Write-Host "== $label"
            $p = Start-Process $file -PassThru -ArgumentList $arguments
            if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "$label timed out" }
            Write-Host "== $label exit code $($p.ExitCode)"
            return $p.ExitCode
          }
          $common = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/DEVICE_HOST=192.0.2.1', '/MACHINE_ID=CI-1', '/TOKEN=ides_dev_ci'
          $badCode = Run-Exe $setup ($common + '/INGEST_URL=http://example.invalid/x', '/LOG=bad.log') 'install with http URL (must fail)'
          if ($badCode -eq 0) { throw 'installer accepted a non-HTTPS ingest URL' }
          $okCode = Run-Exe $setup ($common + '/INGEST_URL=https://example.invalid/api/attendance/device-events', '/LOG=install.log') 'install'
          if ($okCode -ne 0) { Get-Content install.log -Tail 60; throw "install failed: $okCode" }
          Get-ScheduledTask -TaskName $task | Out-Null
          if (-not (Select-String -Path $cfg -Pattern '^ATTENDANCE_MACHINE_ID=CI-1' -Quiet)) { throw 'config not written' }
          $who = (Get-Acl $cfg).Access | ForEach-Object { $_.IdentityReference.Value }
          $extra = $who | Where-Object { $_ -notmatch 'SYSTEM|Administrators' }
          if ($extra) { throw "config readable by: $extra" }
          $unCode = Run-Exe "$env:ProgramFiles\IDeS Device Connector\unins000.exe" ('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') 'uninstall'
          if (Get-ScheduledTask -TaskName $task -ErrorAction SilentlyContinue) { throw 'task not removed on uninstall' }
      - name: Installer logs
        if: failure() && matrix.name == 'windows'
        shell: pwsh
        run: |
          Get-ChildItem "$env:ProgramData\IDeS Device Connector\*.txt" -ErrorAction SilentlyContinue | ForEach-Object { "--- $_"; Get-Content $_ }
          Get-ChildItem *.log | ForEach-Object { "--- $_"; Get-Content $_ | Select-String -Pattern 'Exception|rror|exit code|register|Running|Process|Start' | Select-Object -Last 40 }
      - uses: actions/upload-artifact@v4
        with:
          name: ides-device-connector-${{ matrix.name }}
          path: dist/ides-device-connector*
